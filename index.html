<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Denah Kelas 3D</title>
<style>
:root{--glass:rgba(255,255,255,.72);--ink:#1f2a37;--line:rgba(31,42,55,.12);--acc:#2f6fed;--shadow:0 6px 20px rgba(20,30,50,.18);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--glass:rgba(30,38,52,.72);--ink:#e8eef7;--line:rgba(255,255,255,.14);--acc:#6c9bff;--shadow:0 6px 20px rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme="dark"]{--glass:rgba(30,38,52,.72);--ink:#e8eef7;--line:rgba(255,255,255,.14);--acc:#6c9bff;--shadow:0 6px 20px rgba(0,0,0,.45);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#dbe8f5;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);overscroll-behavior:none}
#app{position:fixed;inset:0;touch-action:none}
canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
#ui{position:fixed;inset:0;pointer-events:none;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
.glass{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:var(--shadow)}
#title{position:absolute;top:12px;left:12px;padding:8px 14px;border-radius:14px;font-weight:600;font-size:14px;line-height:1.2}
#title small{display:block;font-weight:400;opacity:.65;font-size:11px}
#views{position:absolute;top:12px;right:12px;display:flex;gap:8px;pointer-events:auto}
.pill{pointer-events:auto;border:1px solid var(--line);color:var(--ink);font:600 13px system-ui,sans-serif;padding:10px 14px;border-radius:999px;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.pill:active,.rb:active{transform:scale(.94);background:var(--acc);color:#fff}
#btns{position:absolute;right:14px;bottom:18px;display:flex;flex-direction:column;gap:10px}
.rb{pointer-events:auto;width:52px;height:52px;border-radius:50%;border:1px solid var(--line);color:var(--ink);font:500 26px/1 system-ui,sans-serif;display:grid;place-items:center;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;padding:0}
.rb svg{width:24px;height:24px;fill:currentColor}
#joy{position:absolute;left:18px;bottom:22px;width:124px;height:124px;border-radius:50%;pointer-events:auto;touch-action:none;user-select:none;-webkit-user-select:none}
#joy::before{content:"";position:absolute;inset:14px;border-radius:50%;border:1.5px dashed var(--line)}
#knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:var(--acc);box-shadow:0 4px 12px rgba(0,0,0,.3);opacity:.92}
#joy i{position:absolute;font-style:normal;font-size:10px;opacity:.5;font-weight:700}
#hint{position:absolute;left:50%;bottom:158px;transform:translateX(-50%);padding:8px 14px;border-radius:12px;font-size:12px;text-align:center;transition:opacity .8s;white-space:nowrap}
@media (min-width:700px){#hint{bottom:24px}}
#err{display:none;position:fixed;inset:0;place-items:center;padding:24px;text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<div id="ui">
  <div id="title" class="glass">Kelas 3D<small>Denah ruang kelas interaktif</small></div>
  <div id="views"><button class="pill glass" id="vIn">Dalam</button><button class="pill glass" id="vTop">Atas</button></div>
  <div id="hint" class="glass">1 jari: putar &bull; 2 jari: zoom/geser &bull; analog: jelajah</div>
  <div id="joy" class="glass" aria-label="Analog virtual"><i style="top:6px;left:50%;transform:translateX(-50%)">&#9650;</i><i style="bottom:6px;left:50%;transform:translateX(-50%)">&#9660;</i><i style="left:8px;top:50%;transform:translateY(-50%)">&#9664;</i><i style="right:8px;top:50%;transform:translateY(-50%)">&#9654;</i><div id="knob"></div></div>
  <div id="btns">
    <button class="rb glass" id="zin" aria-label="Perbesar">+</button>
    <button class="rb glass" id="zout" aria-label="Perkecil">&minus;</button>
    <button class="rb glass" id="rst" aria-label="Reset kamera"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg></button>
  </div>
</div>
<div id="err" class="glass">Gagal memuat Three.js. Periksa koneksi internet lalu muat ulang halaman.</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
if(!window.THREE||!THREE.OrbitControls){var e=document.getElementById('err');e.style.display='grid';return;}
var $=function(i){return document.getElementById(i)};
var W=10,D=8,H=3.2;
var dark=window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches;
var app=$('app');
var renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);
var scene=new THREE.Scene();
scene.background=new THREE.Color(dark?0x1b2433:0xdbe8f5);
var camera=new THREE.PerspectiveCamera(50,1,.1,120);
var HOME={p:new THREE.Vector3(8,6.5,9.5),t:new THREE.Vector3(0,1,0)};
camera.position.copy(HOME.p);
var controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.target.copy(HOME.t);
controls.enableDamping=true;controls.dampingFactor=.08;
controls.enableRotate=true;controls.enableZoom=true;controls.enablePan=true;controls.screenSpacePanning=false;
controls.minDistance=1.5;controls.maxDistance=24;
controls.minPolarAngle=.05;controls.maxPolarAngle=Math.PI/2-.03;
controls.rotateSpeed=.7;controls.zoomSpeed=.9;
controls.touches={ONE:THREE.TOUCH.ROTATE,TWO:THREE.TOUCH.DOLLY_PAN};
controls.update();

/* ---------- helpers ---------- */
var mats={};
function M(c,o){var k=c+JSON.stringify(o||{});return mats[k]||(mats[k]=new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.7,metalness:0},o||{})));}
function box(w,h,d,c,x,y,z,p,o){var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c,o));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;(p||scene).add(m);return m;}
function cyl(rt,rb,h,c,x,y,z,p,o){var m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,14),M(c,o));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;(p||scene).add(m);return m;}
function grp(x,y,z,ry,p){var g=new THREE.Group();g.position.set(x,y,z);g.rotation.y=ry||0;(p||scene).add(g);return g;}
function tex(w,h,fn){var c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);var t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=4;return t;}

/* ---------- lights ---------- */
scene.add(new THREE.HemisphereLight(0xffffff,0x9aa7b8,.95));
var sun=new THREE.DirectionalLight(0xfff3dd,.85);
sun.position.set(-9,12,5);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
var sc=sun.shadow.camera;sc.left=-9;sc.right=9;sc.top=9;sc.bottom=-9;sc.near=1;sc.far=40;sun.shadow.bias=-.0005;
scene.add(sun);

/* ---------- floor & ground ---------- */
var ft=tex(256,256,function(c,w,h){c.fillStyle='#d8cdb8';c.fillRect(0,0,w,h);c.strokeStyle='rgba(120,100,70,.35)';c.lineWidth=3;c.strokeRect(0,0,w,h);c.beginPath();c.moveTo(w/2,0);c.lineTo(w/2,h);c.moveTo(0,h/2);c.lineTo(w,h/2);c.stroke();});
ft.wrapS=ft.wrapT=THREE.RepeatWrapping;ft.repeat.set(W/1.5,D/1.5);
var floor=new THREE.Mesh(new THREE.PlaneGeometry(W,D),new THREE.MeshStandardMaterial({map:ft,roughness:.55}));
floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
box(W+.4,.3,D+.4,0x8e98a5,0,-.16,0).castShadow=false;
var ground=new THREE.Mesh(new THREE.CircleGeometry(40,48),new THREE.MeshStandardMaterial({color:dark?0x26324a:0xe9f0f6,roughness:1}));
ground.rotation.x=-Math.PI/2;ground.position.y=-.32;ground.receiveShadow=true;scene.add(ground);

/* ---------- walls (dengan lubang asli) ---------- */
var walls=[];
function wall(len,holes,x,z,ry,n){
  var s=new THREE.Shape();s.moveTo(-len/2,0);s.lineTo(len/2,0);s.lineTo(len/2,H);s.lineTo(-len/2,H);s.closePath();
  holes.forEach(function(h){var p=new THREE.Path();p.moveTo(h.x-h.w/2,h.y);p.lineTo(h.x+h.w/2,h.y);p.lineTo(h.x+h.w/2,h.y+h.h);p.lineTo(h.x-h.w/2,h.y+h.h);p.closePath();s.holes.push(p);});
  var g=new THREE.ExtrudeGeometry(s,{depth:.2,bevelEnabled:false});g.translate(0,0,-.1);
  var m=new THREE.Mesh(g,M(0xd8b98f));m.receiveShadow=true;
  var G=grp(x,0,z,ry);G.add(m);G.userData.n=n;G.userData.c=new THREE.Vector3(x,0,z);
  box(len,.9,.215,0x9c7650,0,.45,0,G).castShadow=false; /* list dinding hijau */
  walls.push(G);return G;
}
function windowAt(G,lx,w,h,y){
  var gl=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshStandardMaterial({color:0xaad4ff,transparent:true,opacity:.28,roughness:.1,side:THREE.DoubleSide}));
  gl.position.set(lx,y+h/2,0);G.add(gl);
  var c=0xffffff;
  [[w+.08,.07,0,y],[w+.08,.07,0,y+h],[w+.08,.04,0,y+h/2]].forEach(function(a){box(a[0],a[1],.14,c,lx+a[2],a[3],0,G).castShadow=false;});
  [-w/2,0,w/2].forEach(function(dx){box(.06,h,.14,c,lx+dx,y+h/2,0,G).castShadow=false;});
  box(w+.2,.05,.3,0xf0f0f0,lx,y-.02,.1,G);
}
var wF=wall(W+.2,[],0,-D/2,0,new THREE.Vector3(0,0,1));
var wB=wall(W+.2,[],0,D/2,Math.PI,new THREE.Vector3(0,0,-1));
var wL=wall(D-.2,[-2.4,0,2.4].map(function(x){return{x:x,y:1,w:1.8,h:1.5}}),-W/2,0,Math.PI/2,new THREE.Vector3(1,0,0));
var wR=wall(D-.2,[{x:2.5,y:0,w:1.1,h:2.2},{x:-1.5,y:1,w:1.6,h:1.5}],W/2,0,-Math.PI/2,new THREE.Vector3(-1,0,0));
[-2.4,0,2.4].forEach(function(x){windowAt(wL,x,1.8,1.5,1)});
windowAt(wR,-1.5,1.6,1.5,1);
/* pintu (sedikit terbuka) */
box(.08,2.25,.16,0x6b4a2f,2.5-.58,1.125,0,wR);box(.08,2.25,.16,0x6b4a2f,2.5+.58,1.125,0,wR);box(1.24,.08,.16,0x6b4a2f,2.5,2.24,0,wR);
var piv=grp(2.0,0,0,-1.1,wR);
box(.96,2.12,.05,0x9a6b3f,.5,1.06,0,piv);box(.5,.8,.02,0xb07f50,.5,1.35,.03,piv);
var hd=new THREE.Mesh(new THREE.SphereGeometry(.035,12,12),M(0xcfd4da,{metalness:.8,roughness:.3}));hd.position.set(.88,1.05,.05);piv.add(hd);
/* atap */
var ceil=new THREE.Mesh(new THREE.PlaneGeometry(W,D),M(0xfafafa));ceil.rotation.x=Math.PI/2;ceil.position.y=H;ceil.receiveShadow=true;scene.add(ceil);
[-2.5,2.5].forEach(function(x){[-2,.5,3].forEach(function(z){box(1.2,.04,.3,0xffffff,x,H-.02,z,null,{emissive:0xfff6d8,emissiveIntensity:.9}).castShadow=false;});});
ceil.userData.top=true;

/* ---------- meja & kursi siswa ---------- */
var BLUE=0x2f6fed,WOOD=0xd9b382,METAL=0x555b66;
function desk(x,z,i){
  var g=grp(x,0,z);
  box(1.1,.04,.6,WOOD,0,.74,0,g);
  box(1.0,.03,.5,0xc29a6a,0,.5,.02,g);
  [-1,1].forEach(function(sx){[-1,1].forEach(function(sz){cyl(.02,.02,.72,METAL,sx*.5,.36,sz*.26,g);});});
  if(i%3===0)box(.26,.012,.19,[0xe4572e,0x29a19c,0xf2c14e][i%3],-.25+(i%2)*.4,.766,.03,g).rotation.y=(i%5)*.2-.4;
  var c=grp(x,0,z+.62,(Math.sin(i*7.3))*.12);
  box(.42,.04,.42,BLUE,0,.44,0,c);box(.42,.34,.04,BLUE,0,.67,.2,c);
  [-1,1].forEach(function(sx){[-1,1].forEach(function(sz){cyl(.015,.015,.42,METAL,sx*.18,.21,sz*.18,c);});});
}
var n=0;[-3.58,-2.42,-.58,.58,2.42,3.58].forEach(function(x){[-1.4,-.1,1.2,2.5].forEach(function(z){desk(x,z,n++);});});

/* ---------- meja & kursi guru ---------- */
(function(){
  var g=grp(-2.5,.12,-2.9);
  box(1.6,.05,.7,0x8a5a36,0,.75,0,g);
  box(.04,.72,.66,0x7a4c2b,-.76,.36,0,g);box(.04,.72,.66,0x7a4c2b,.76,.36,0,g);box(1.5,.5,.03,0x7a4c2b,0,.5,-.3,g);
  [0,.2].forEach(function(dy){box(.4,.16,.02,0x9a6b3f,.5,.62-dy,.34,g);});
  box(.36,.015,.25,0x2b2f36,-.3,.785,.05,g);
  var s=box(.36,.24,.012,0x2b2f36,-.3,.9,-.07,g);s.rotation.x=-.25;
  box(.32,.2,.004,0x7ec8ff,-.3,.9,-.062,g,{emissive:0x4aa8ff,emissiveIntensity:.5}).rotation.x=-.25;
  cyl(.04,.04,.1,0xe4572e,.55,.82,-.1,g);
  var c=grp(-2.5,.12,-3.55,Math.PI);
  box(.5,.05,.5,0x333c4a,0,.46,0,c);box(.5,.5,.05,0x333c4a,0,.75,.24,c);cyl(.025,.025,.44,METAL,0,.22,0,c);
  [0,1,2,3,4].forEach(function(k){var a=k*1.2566;box(.3,.03,.04,METAL,Math.cos(a)*.14,.03,Math.sin(a)*.14,c).rotation.y=-a;});
})();

/* ---------- papan tulis ---------- */
(function(){
  var z=-D/2+.12;
  box(3.9,1.3,.04,0xb8bcc4,0,1.75,z);
  var bt=tex(512,170,function(c,w,h){c.fillStyle='#f7f9fb';c.fillRect(0,0,w,h);c.fillStyle='#1d4ed8';c.font='bold 34px "Comic Sans MS",cursive,sans-serif';c.fillText('Matematika',22,48);c.fillStyle='#222';c.font='30px "Comic Sans MS",cursive,sans-serif';c.fillText('2x + 3 = 11',22,95);c.fillText('x = 4',22,138);c.fillStyle='#dc2626';c.font='28px "Comic Sans MS",cursive,sans-serif';c.fillText('Selamat Datang di Kelas!',230,60);c.strokeStyle='#16a34a';c.lineWidth=3;c.beginPath();c.arc(380,120,26,0,6.3);c.stroke();});
  var f=new THREE.Mesh(new THREE.PlaneGeometry(3.7,1.1),new THREE.MeshStandardMaterial({map:bt,roughness:.35}));f.position.set(0,1.75,z+.025);scene.add(f);
  box(3.5,.04,.09,0xb8bcc4,0,1.1,z+.04);
  [[0x1d4ed8,-.4],[0xdc2626,-.3],[0x111111,-.2]].forEach(function(m){cyl(.012,.012,.11,m[0],m[1]+.5,1.14,z+.05).rotation.z=Math.PI/2;});
  box(.18,.06,.05,0x888,1.4,1.14,z+.05);
  /* layar proyektor & proyektor */
  box(.4,.12,.3,0x2b2f36,0,H-.2,.2);cyl(.02,.02,.16,0x888,0,H-.08,.2);cyl(.04,.04,.03,0x1a1a1a,0,H-.2,.05).rotation.x=Math.PI/2;
})();

/* ---------- dinding belakang: jadwal, jam, lemari ---------- */
(function(){
  var z=D/2-.12;
  var g=grp(-.9,1.8,z,Math.PI);
  box(2.75,1.35,.05,0x6b4a2f,0,0,0,g);
  var jt0=tex(256,160,function(c,w,h){c.fillStyle='#d9a76a';c.fillRect(0,0,w,h);c.fillStyle='#fff';c.fillRect(8,8,w-16,h-16);c.fillStyle='#1f2a37';c.font='bold 18px sans-serif';c.fillText('JADWAL PIKET',60,32);c.strokeStyle='#999';for(var i=0;i<5;i++){c.strokeRect(14,44+i*22,228,22);c.fillStyle='#333';c.font='13px sans-serif';c.fillText(['Senin','Selasa','Rabu','Kamis','Jumat'][i],20,60+i*22);}});
  var mt=tex(1020,500,function(c,w,h){
  c.fillStyle='#c89a62';c.fillRect(0,0,w,h);
  for(var i=0;i<3000;i++){c.fillStyle=i%2?'rgba(90,60,30,.16)':'rgba(240,200,150,.2)';c.fillRect(Math.random()*w,Math.random()*h,2,2);}
  function pin(x,y,col){c.fillStyle=col;c.beginPath();c.arc(x,y,7,0,6.3);c.fill();c.fillStyle='rgba(255,255,255,.65)';c.beginPath();c.arc(x-2,y-2,2.5,0,6.3);c.fill();}
  function poster(x,y,pw,ph,rot,draw){c.save();c.translate(x+pw/2,y+ph/2);c.rotate(rot);c.shadowColor='rgba(0,0,0,.4)';c.shadowBlur=14;c.shadowOffsetY=5;c.fillStyle='#fff';c.fillRect(-pw/2,-ph/2,pw,ph);c.shadowColor='transparent';c.save();c.beginPath();c.rect(-pw/2+8,-ph/2+8,pw-16,ph-16);c.clip();c.translate(-pw/2+8,-ph/2+8);c.textAlign='center';draw(pw-16,ph-16);c.restore();pin(0,-ph/2+14,'#e11d48');c.restore();}
  function lg(w,h,stops){var q=c.createLinearGradient(0,0,0,h);stops.forEach(function(s,i){q.addColorStop(i/(stops.length-1),s)});c.fillStyle=q;c.fillRect(0,0,w,h);}
  function sticky(x,y,col,rot,t){c.save();c.translate(x+35,y+35);c.rotate(rot);c.shadowColor='rgba(0,0,0,.35)';c.shadowBlur=8;c.shadowOffsetY=3;c.fillStyle=col;c.fillRect(-35,-35,70,70);c.shadowColor='transparent';c.fillStyle='#333';c.font='15px "Comic Sans MS",cursive,sans-serif';c.textAlign='center';c.fillText(t,0,5);pin(0,-30,'#2563eb');c.restore();}
  /* header */
  c.fillStyle='#6b4a2f';c.fillRect(310,8,400,46);c.fillStyle='#f6e7cf';c.font='bold 30px sans-serif';c.textAlign='center';c.fillText('MADING KELAS',510,41);
  /* 1 sunset */
  poster(24,72,200,270,-.03,function(pw,ph){lg(pw,ph,['#ff7e5f','#feb47b','#ffe3b3']);c.fillStyle='#fff4c2';c.beginPath();c.arc(pw/2,ph*.5,36,0,6.3);c.fill();c.fillStyle='#6b3f5e';c.beginPath();c.moveTo(0,ph);c.lineTo(0,ph*.72);c.lineTo(pw*.3,ph*.5);c.lineTo(pw*.55,ph*.75);c.lineTo(pw*.75,ph*.58);c.lineTo(pw,ph*.8);c.lineTo(pw,ph);c.fill();c.fillStyle='#3a2342';c.beginPath();c.moveTo(0,ph);c.lineTo(0,ph*.88);c.lineTo(pw*.4,ph*.7);c.lineTo(pw*.7,ph*.9);c.lineTo(pw,ph*.78);c.lineTo(pw,ph);c.fill();c.fillStyle='#fff';c.font='bold 26px sans-serif';c.fillText('EXPLORE',pw/2,44);c.font='13px sans-serif';c.fillText('find your own path',pw/2,64);});
  /* 2 galaxy */
  poster(250,70,210,272,.02,function(pw,ph){lg(pw,ph,['#0f0c29','#302b63','#24243e']);c.fillStyle='#fff';for(var i=0;i<45;i++){c.fillRect(Math.random()*pw,Math.random()*ph,1+Math.random()*2,1+Math.random()*2);}var q=c.createLinearGradient(0,0,pw,ph);q.addColorStop(0,'#f6d365');q.addColorStop(1,'#fda085');c.fillStyle=q;c.beginPath();c.arc(pw/2,ph*.5,46,0,6.3);c.fill();c.strokeStyle='rgba(255,255,255,.75)';c.lineWidth=5;c.beginPath();c.ellipse(pw/2,ph*.5,84,18,-.4,0,6.3);c.stroke();c.fillStyle='#fff';c.font='bold 28px sans-serif';c.fillText('GALAXY',pw/2,46);c.font='12px sans-serif';c.fillText('the universe is calling',pw/2,ph-18);});
  /* 3 quote */

function resize(){var w=app.clientWidth,h=app.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}

var tw=null;
function ease(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2}
function go(p,t,d){tw={p0:camera.position.clone(),p1:p.clone(),t0:controls.target.clone(),t1:t.clone(),t:0,d:d||.8};}
controls.addEventListener('start',function(){tw=null;});
function zoom(f){tw=null;var off=camera.position.clone().sub(controls.target);var nl=Math.min(controls.maxDistance,Math.max(controls.minDistance,off.length()*f));off.setLength(nl);camera.position.copy(controls.target).add(off);}

/* analog virtual */
var jb=$('joy'),jk=$('knob'),jv={x:0,y:0},jid=null;
function jset(e){var r=jb.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,R=r.width/2-jk.offsetWidth/2+4,l=Math.hypot(dx,dy);if(l>R){dx*=R/l;dy*=R/l;}jk.style.transform='translate('+dx+'px,'+dy+'px)';jv.x=dx/R;jv.y=-dy/R;}
function jend(e){if(e.pointerId!==jid)return;jid=null;jv.x=jv.y=0;jk.style.transform='translate(0,0)';}
jb.addEventListener('pointerdown',function(e){if(jid!==null)return;jid=e.pointerId;try{jb.setPointerCapture(e.pointerId)}catch(_){}tw=null;jset(e);e.preventDefault();});
jb.addEventListener('pointermove',function(e){if(e.pointerId===jid){jset(e);e.preventDefault();}});
jb.addEventListener('pointerup',jend);jb.addEventListener('pointercancel',jend);jb.addEventListener('lostpointercapture',jend);
jb.addEventListener('contextmenu',function(e){e.preventDefault()});

/* ---------- loop ---------- */
var clock=new THREE.Clock(),LIM_X=W/2-.4,LIM_Z=D/2-.4,tmp=new THREE.Vector3(),old=new THREE.Vector3();
function loop(){
  requestAnimationFrame(loop);
  var dt=Math.min(clock.getDelta(),.05);
  if(tw){
    tw.t+=dt/tw.d;var k=ease(Math.min(tw.t,1));
    camera.position.lerpVectors(tw.p0,tw.p1,k);controls.target.lerpVectors(tw.t0,tw.t1,k);
    if(tw.t>=1)tw=null;
  }else{
    var x=jv.x,y=jv.y;
    if(keys.a||keys.arrowleft)x-=1;if(keys.d||keys.arrowright)x+=1;if(keys.w||keys.arrowup)y+=1;if(keys.s||keys.arrowdown)y-=1;
    var m=Math.hypot(x,y);
    if(m>.08){
      if(m>1){x/=m;y/=m;m=1;}
      var a=controls.getAzimuthalAngle(),sp=4.2*dt;
      var fx=-Math.sin(a),fz=-Math.cos(a),rx=Math.cos(a),rz=-Math.sin(a);
      old.copy(controls.target);
      controls.target.x=Math.max(-LIM_X,Math.min(LIM_X,old.x+(rx*x+fx*y)*sp));
      controls.target.z=Math.max(-LIM_Z,Math.min(LIM_Z,old.z+(rz*x+fz*y)*sp));
      camera.position.add(tmp.copy(controls.target).sub(old));
    }
  }
  controls.target.x=Math.max(-LIM_X,Math.min(LIM_X,controls.target.x));
  controls.target.z=Math.max(-LIM_Z,Math.min(LIM_Z,controls.target.z));
  controls.update();
  /* sembunyikan dinding/atap yang menghalangi kamera */
  var cp=camera.position;
  walls.forEach(function(w){tmp.copy(cp).sub(w.userData.c);w.visible=tmp.dot(w.userData.n)>0;});
  ceil.visible=cp.y<H-.05;
  var d=new Date();
  _hM.rotation.z=-(d.getMinutes()+d.getSeconds()/60)*Math.PI/30;
  _hH.rotation.z=-((d.getHours()%12)+d.getMinutes()/60)*Math.PI/6;
  renderer.render(scene,camera);
}
loop();
})();
